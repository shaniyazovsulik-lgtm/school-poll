<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Опрос по теме урока</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#2f6fed;--ln:#e2e2dd;--r:#d9534f;--g:#2e9d5b;--y:#e0a21a}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--card:#222428;--tx:#ececea;--mu:#9a9a95;--ln:#34363b;--ac:#6b9bff}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
input[type=text],select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%;margin:4px 0 10px}
.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:11px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.mu{color:var(--mu);font-size:14px}.err{color:var(--r)}
.pic{max-width:100%;max-height:300px;border-radius:8px;display:block;margin:8px 0}
.big{font-size:30px;font-weight:700}.big2{font-size:20px;margin-top:4px}.good{border-color:var(--g)}.bad{border-color:var(--r)}.part{border-color:var(--y)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:8px 0}.mrow select{margin:0}
.pair{margin:4px 0;font-size:15px}.pk{color:var(--g)}.pn{color:var(--r)}
</style>
</head>
<body>
<h1 id="ttl">Опрос по теме урока</h1>
<div id="app"><p class="mu">Загрузка…</p></div>
<script>
var $=function(i){return document.getElementById(i)},esc=function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")};
var PID=new URLSearchParams(location.search).get("p"),poll=null,picks=[],who=null;
function st(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function msg(t){$("app").innerHTML='<div class="card"><h2>'+esc(t)+'</h2></div>'}
if(!PID){msg("Отсканируйте QR-код, который показал учитель")}
else fetch("/api/poll/"+PID).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(p){poll=p;
 if(st("done_"+PID)){var sr=st("res_"+PID);if(sr&&p.mode==="test"){showResult(JSON.parse(sr));return}msg("Вы уже прошли этот опрос. Спасибо!");return}
 if(!p.open){msg("Опрос закрыт учителем");return}form()}).catch(function(e){msg(e.message||"Ошибка загрузки")});
function form(){var s=JSON.parse(st("who")||"{}");
 $("app").innerHTML='<div class="card"><div class="mu">'+(poll.mode==="test"?"Тест · тема урока":"Тема урока")+'</div><h2>'+esc(poll.topic||"Опрос")+'</h2>'+
 '<label class="mu">Фамилия</label><input type="text" id="sn" autocomplete="family-name" value="'+esc(s.surname||"")+'">'+
 '<label class="mu">Имя</label><input type="text" id="nm" autocomplete="given-name" value="'+esc(s.name||"")+'">'+
 '<label class="mu">Класс</label><select id="cl">'+poll.classes.map(function(c){return'<option'+(c===s.cls?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select>'+
 '<button class="btn pri" id="go">Начать</button> <span class="err" id="e"></span></div>';
 $("go").onclick=function(){var a=$("sn").value.trim(),b=$("nm").value.trim();if(!a||!b){$("e").textContent="Введите фамилию и имя";return}
  who={surname:a,name:b,cls:$("cl").value};sv("who",JSON.stringify(who));quiz()}}
function fmt(n){return String(n).replace(".",",")}
function balls(n){var i=Math.floor(n);if(n!==i)return"балла";var m=i%100,d=i%10;if(m>=11&&m<=14)return"баллов";return d===1?"балл":d>=2&&d<=4?"балла":"баллов"}
function ballsOf(n){var i=Math.floor(n);if(n!==i)return"балла";var m=i%100,d=i%10;if(m>=11&&m<=14)return"баллов";return d===1?"балла":"баллов"}
function labels(q,a){return(Array.isArray(a)?a:[a]).map(function(i){return q.o[i]?q.o[i].l:"—"})}
function matchUI(q,qi){var ord=order[qi]||(order[qi]=shuffle(q.right.map(function(_,i){return i})));
 return q.left.map(function(x,j){return'<div class="mrow"><div>'+esc(x.l)+'</div><select class="mt" data-qi="'+qi+'" data-j="'+j+'"><option value="">— выберите —</option>'+ord.map(function(k){return'<option value="'+k+'">'+esc(q.right[k].l)+'</option>'}).join("")+'</select></div>'}).join("")}
var order=[];function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function matchDone(q,v){if(!v)return false;for(var j=0;j<q.left.length;j++)if(!(v[j]>=0))return false;return true}
function pairsHtml(q,it){return it.pairs.map(function(p,j){var y=q.right[p.yours]?q.right[p.yours].l:"—";return'<div class="pair '+(p.ok?"pk":"pn")+'">'+(p.ok?"✓ ":"✗ ")+esc(q.left[j].l)+' → <b>'+esc(y)+'</b>'+(p.ok?"":' <span class="mu">(верно: '+esc(q.right[p.correct].l)+')</span>')+'</div>'}).join("")}
function showResult(r){var h='<div class="card"><div class="mu">Ваш результат</div><div class="big">'+fmt(r.score)+' из '+fmt(r.max)+' '+ballsOf(r.max)+'</div><div class="big2">Оценка: <b>'+esc(r.grade)+'</b></div></div><h2 style="margin:16px 0 8px">Разбор ответов</h2>';
 r.items.forEach(function(it){var q=poll.qs[it.i];if(!q)return;
  h+='<div class="card '+(it.ok?"good":it.got>0?"part":"bad")+'"><h2>'+esc(q.t)+'</h2><div>'+(it.ok?"✓ Верно":it.got>0?"≈ Частично верно":"✗ Неверно")+' · '+fmt(it.got)+' из '+fmt(it.pts)+' '+ballsOf(it.pts)+'</div>'+
  (it.pairs?pairsHtml(q,it):'<div class="mu">Ваш ответ: '+esc(labels(q,it.yours).join(", "))+'</div>'+(it.ok?"":'<div>Правильный ответ: <b>'+esc(labels(q,it.correct).join(", "))+'</b></div>'))+'</div>'});
 $("app").innerHTML=h}
function quiz(){var h='<div class="mu" style="margin-bottom:8px">'+esc(who.surname+" "+who.name+", "+who.cls)+'</div>';
 poll.qs.forEach(function(q,qi){h+='<div class="card"><h2>'+esc(q.t)+(poll.mode==="test"&&(q.k==="quiz"||q.k==="match")?' <span class="mu">· '+fmt(q.pts==null?1:q.pts)+' '+balls(q.pts==null?1:q.pts)+'</span>':"")+'</h2>'+(q.img?'<img class="pic" src="'+q.img+'" alt="">':"");
  if(q.k==="quiz")h+='<p class="mu">Можно выбрать несколько ответов, если верных несколько</p>';
  if(q.k==="match")h+='<p class="mu">Выберите для каждого элемента подходящий вариант</p>'+matchUI(q,qi);
  if(q.k==="text")h+='<input type="text" class="st" data-qi="'+qi+'" placeholder="Ваш ответ">';
  else q.o.forEach(function(o,oi){h+='<button class="btn opt" data-qi="'+qi+'" data-oi="'+oi+'">'+esc(o.l)+'</button>'});h+='</div>'});
 $("app").innerHTML=h+'<button class="btn pri" id="send">Отправить</button> <span class="err" id="e"></span>'}
function paint(){document.querySelectorAll(".opt").forEach(function(b){var q=poll.qs[b.dataset.qi],v=picks[b.dataset.qi],i=+b.dataset.oi;b.classList.toggle("pri",q.k==="quiz"?(v||[]).indexOf(i)>=0:v===i)})}
$("app").addEventListener("change",function(e){var t=e.target;if(t.classList.contains("mt")){var qi=+t.dataset.qi,a=picks[qi]||(picks[qi]=[]);a[+t.dataset.j]=t.value===""?-1:+t.value}});
$("app").addEventListener("input",function(e){if(e.target.classList.contains("st"))picks[e.target.dataset.qi]=e.target.value});
$("app").addEventListener("click",function(e){var t=e.target;
 if(t.classList.contains("opt")){var qi=+t.dataset.qi,oi=+t.dataset.oi;
  if(poll.qs[qi].k==="quiz"){var a=picks[qi]||[],x=a.indexOf(oi);if(x>=0)a.splice(x,1);else a.push(oi);picks[qi]=a}else picks[qi]=oi;paint()}
 if(t.id==="send"){for(var i=0;i<poll.qs.length;i++){var q=poll.qs[i],v=picks[i];if(q.k==="quiz"&&!(v&&v.length)||q.k==="choice"&&v===undefined||q.k==="match"&&!matchDone(q,v)){$("e").textContent="Ответьте на все вопросы";return}}
  var ans=poll.qs.map(function(q,i){return q.k==="text"?(picks[i]||""):picks[i]});t.disabled=true;
  fetch("/api/poll/"+PID+"/answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({surname:who.surname,name:who.name,cls:who.cls,answers:ans})})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(j){sv("done_"+PID,"1");if(j.result){sv("res_"+PID,JSON.stringify(j.result));showResult(j.result)}else msg("Спасибо! Ответ принят.")})
  .catch(function(er){t.disabled=false;$("e").textContent=er.message||"Не удалось отправить, попробуйте ещё раз"})}});
</script>
</body>
</html>
